name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rushhour
          POSTGRES_PASSWORD: rushhour
          POSTGRES_DB: rushhour
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rushhour -d rushhour"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://rushhour:rushhour@localhost:5432/rushhour
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests against real Postgres and Redis
        run: pytest --junitxml=junit.xml
      - name: Test summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          if not os.path.exists("junit.xml"):
              raise SystemExit("No junit.xml produced")
          s = ET.parse("junit.xml").getroot()
          s = s if s.tag == "testsuite" else s.find("testsuite")
          total, fail, err, skip = (int(s.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
          print("## Test results (real Postgres 16 + Redis 7)\n")
          print("| Total | Passed | Failed | Errors | Skipped | Time |")
          print("|---|---|---|---|---|---|")
          print(f"| {total} | {total - fail - err - skip} | {fail} | {err} | {skip} | {float(s.get('time', 0)):.1f}s |")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit
          path: junit.xml

  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, inventory, checkout, payment_mock, order_worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute image name and tag
        id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          name="${{ matrix.service }}"
          echo "image=${REGISTRY}/${repo}/${name//_/-}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "source=https://github.com/${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (kept as tarball for scan and smoke jobs)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.source=${{ steps.meta.outputs.source }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.service }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          compression-level: 0
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image (main only; layers come from the cache)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:main
          labels: org.opencontainers.image.source=${{ steps.meta.outputs.source }}
          cache-from: type=gha,scope=${{ matrix.service }}

  scan:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, inventory, checkout, payment_mock, order_worker]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.service }}
          path: ${{ runner.temp }}/image
      - name: Trivy SARIF report (CRITICAL/HIGH with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image/image.tar
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload SARIF to code scanning
        if: always() && hashFiles('trivy.sarif') != '' && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.service }}
      - name: Trivy gate (fails on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image/image.tar
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

  sign:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, scan, test, lint, smoke, chart, k8s]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, inventory, checkout, payment_mock, order_worker]
    steps:
      - name: Compute image name and tag
        id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          name="${{ matrix.service }}"
          echo "image=${REGISTRY}/${repo}/${name//_/-}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image digest
        id: digest
        run: |
          d=$(docker buildx imagetools inspect "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" --format '{{.Manifest.Digest}}')
          echo "ref=${{ steps.meta.outputs.image }}@${d}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.digest.outputs.ref }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.service }}
          path: sbom.spdx.json
      - name: Sign image and attach SBOM attestation (keyless)
        run: |
          cosign sign --yes "${{ steps.digest.outputs.ref }}"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${{ steps.digest.outputs.ref }}"
      - name: Verify signature and attestation
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@${GITHUB_REF}"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify "${{ steps.digest.outputs.ref }}" \
            --certificate-identity "$identity" --certificate-oidc-issuer "$issuer"
          cosign verify-attestation "${{ steps.digest.outputs.ref }}" --type spdxjson \
            --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" > /dev/null

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
      - name: Load the images built in this run
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          for svc in catalog inventory checkout payment_mock order_worker; do
            name="${svc//_/-}"
            docker load -i "${RUNNER_TEMP}/images/image-${svc}/image.tar"
            # compose expects rush-hour/<name>:dev
            docker tag "${REGISTRY}/${repo}/${name}:sha-${GITHUB_SHA::7}" "rush-hour/${name}:dev"
          done
      - name: Start the stack
        env:
          PAYMENT_DECLINE_RATE: "0"
        run: docker compose up --no-build -d
      - name: End-to-end check
        run: ./scripts/smoke.sh
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install helm and kubeconform (pinned, checksum-verified)
        run: ./scripts/k8s/install-tools.sh helm kubeconform
      - name: helm lint
        run: |
          helm lint deploy/helm/rush-hour -f deploy/helm/rush-hour/values-ci.yaml --strict
          helm lint deploy/helm/rush-hour --strict \
            --set postgres.enabled=false --set database.host=db.example.com \
            --set redis.enabled=false --set redis.externalUrl=redis://cache.example.com:6379/0
      - name: helm template | kubeconform (strict, incl. HPA autoscaling/v2 and PDB policy/v1)
        run: |
          helm template rush-hour deploy/helm/rush-hour -f deploy/helm/rush-hour/values-ci.yaml \
            --set image.tag=sha-0000000 > rendered-ci.yaml
          helm template rush-hour deploy/helm/rush-hour \
            --set postgres.enabled=false --set database.host=db.example.com \
            --set redis.enabled=false --set redis.externalUrl=redis://cache.example.com:6379/0 \
            > rendered-external.yaml
          for f in rendered-ci.yaml rendered-external.yaml; do
            kubeconform -strict -summary -kubernetes-version 1.34.0 "$f"
          done
          # HPA and PDB must really be in the output (kubeconform skips what it does not know)
          grep -c 'kind: HorizontalPodAutoscaler' rendered-ci.yaml
          grep -c 'kind: PodDisruptionBudget' rendered-ci.yaml

  k8s:
    needs: [build, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KIND_NODE_IMAGE: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
      METRICS_SERVER_URL: https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.1/components.yaml
      METRICS_SERVER_SHA256: 3c7f57cdbee0f57fb0259a150e8f6d6cb4f29d72d1aa5dce8803151dd6d4c2a1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
      - name: Install helm, kind and k6 (pinned, checksum-verified)
        run: ./scripts/k8s/install-tools.sh helm kind k6
      - name: Create kind cluster (1 control plane + 2 workers)
        run: kind create cluster --name rush-hour --config deploy/kind/cluster.yaml --image "$KIND_NODE_IMAGE" --wait 180s
      - name: Load the images built in this run into the nodes
        run: |
          for svc in catalog inventory checkout payment_mock order_worker; do
            kind load image-archive "${RUNNER_TEMP}/images/image-${svc}/image.tar" --name rush-hour
          done
      - name: Install metrics-server (pinned; kubelet TLS check off because kind uses self-signed certs)
        run: |
          curl -fsSL --retry 3 -o metrics-server.yaml "$METRICS_SERVER_URL"
          echo "$METRICS_SERVER_SHA256  metrics-server.yaml" | sha256sum -c -
          kubectl apply -f metrics-server.yaml
          kubectl -n kube-system patch deployment metrics-server --type=json \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=180s
      - name: Install the chart (migration hook runs first; atomic rolls back on failure)
        run: |
          # --atomic removes the pods on failure, so keep a trace of what happened while it ran
          mkdir -p diag
          ( while true; do
              { date -u +%T; kubectl get pods -A -o wide; kubectl get events -A --sort-by=.lastTimestamp | tail -30; \
                kubectl logs -l app.kubernetes.io/name=migrate --tail=50 --all-containers --prefix; } >> diag/install.log 2>&1
              sleep 5
            done ) &
          watcher=$!
          trap 'kill $watcher' EXIT
          helm upgrade --install rush-hour deploy/helm/rush-hour \
            -f deploy/helm/rush-hour/values-ci.yaml --set image.tag="sha-${GITHUB_SHA::7}" \
            --wait --atomic --timeout 8m
          kubectl get pods -o wide
      - name: Smoke test through the NodePorts
        run: ./scripts/smoke.sh
      - name: Load burst, HPA scale-up and pod kill
        run: |
          rc=0
          REPORT="$PWD/load-report.md" OUT="$PWD/load-out" ./scripts/k8s/run-load.sh || rc=$?
          [ -f load-report.md ] && cat load-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get all -A -o wide || true
          kubectl get hpa,pdb,pvc,events -A || true
          for p in $(kubectl get pods -A --no-headers | awk '$4 != "Running" && $4 != "Completed" {print $1"/"$2}'); do
            echo "::group::describe $p"; kubectl -n "${p%/*}" describe pod "${p#*/}" || true; echo "::endgroup::"
          done
          for p in $(kubectl get pods --no-headers -o name); do
            echo "::group::logs $p"; kubectl logs "$p" --all-containers --tail=300 --prefix 2>&1 | grep -vE '"GET /(healthz|readyz)' | tail -80 || true; echo "::endgroup::"
          done
          [ -f diag/install.log ] && tail -150 diag/install.log || true
      - name: Delete the cluster
        if: always()
        run: kind delete cluster --name rush-hour
