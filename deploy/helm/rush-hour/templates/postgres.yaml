{{- if .Values.postgres.enabled }}
{{- $name := printf "%s-postgres" (include "rh.fullname" .) }}
{{- $ctx := dict "root" . "name" "postgres" }}
# Demo-only Postgres. Both objects are install-time hooks so the database exists before the
# migration hook job runs (hooks run before normal resources). Helm does not touch them on upgrade
# or uninstall: the data stays. In a real cloud set postgres.enabled=false and use RDS.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "rh.labels" $ctx | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  selector:
    {{- include "rh.selector" $ctx | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "rh.labels" $ctx | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "rh.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rh.labels" $ctx | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- include "rh.podSecurity" . | nindent 8 }}
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          args: ["-c", "max_connections={{ .Values.postgres.maxConnections }}"]
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: {{ .Values.database.user | quote }} }
            - { name: POSTGRES_DB, value: {{ .Values.database.name | quote }} }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "rh.dbSecret" . }}, key: password }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.database.user | quote }}, "-d", {{ .Values.database.name | quote }}]
            periodSeconds: 5
            failureThreshold: 6
          startupProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.database.user | quote }}, "-d", {{ .Values.database.name | quote }}]
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.database.user | quote }}, "-d", {{ .Values.database.name | quote }}]
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            {{- include "rh.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
