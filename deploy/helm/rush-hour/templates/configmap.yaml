apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rh.fullname" . }}-config
  labels:
    {{- include "rh.labels" (dict "root" . "name" "config") | nindent 4 }}
data:
  REDIS_URL: {{ include "rh.redisUrl" . | quote }}
  CATALOG_URL: "http://{{ include "rh.fullname" . }}-catalog:8000"
  INVENTORY_URL: "http://{{ include "rh.fullname" . }}-inventory:8000"
  PAYMENT_URL: "http://{{ include "rh.fullname" . }}-payment-mock:8000"
  DB_POOL_MIN: {{ .Values.database.poolMin | quote }}
  DB_POOL_MAX: {{ .Values.database.poolMax | quote }}
  {{- if .Values.pgbouncer.enabled }}
  DB_STATEMENT_CACHE_SIZE: {{ .Values.database.statementCacheSize | quote }}
  {{- end }}
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
