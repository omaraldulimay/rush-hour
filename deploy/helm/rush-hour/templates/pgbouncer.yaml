{{- if .Values.pgbouncer.enabled }}
{{- $name := printf "%s-pgbouncer" (include "rh.fullname" .) }}
{{- $ctx := dict "root" . "name" "pgbouncer" }}
# Transaction pooling: many short app connections share a few real Postgres connections.
# Needs asyncpg's prepared statement cache off (database.statementCacheSize=0) - see docs/architecture.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "rh.labels" $ctx | nindent 4 }}
data:
  pgbouncer.ini: |
    {{- include "rh.pgbouncerIni" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "rh.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "rh.selector" $ctx | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "rh.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.pgbouncer.replicas }}
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      {{- include "rh.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rh.labels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ include "rh.pgbouncerIni" . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- include "rh.podSecurity" . | nindent 8 }}
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      {{- include "rh.spread" $ctx | nindent 6 }}
      containers:
        - name: pgbouncer
          image: {{ .Values.pgbouncer.image }}
          # Bypass the image entrypoint (it writes its config to the image filesystem): we mount ours.
          command: ["/usr/bin/pgbouncer"]
          args: ["/etc/pgbouncer/pgbouncer.ini"]
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            tcpSocket: { port: postgres }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: postgres }
            periodSeconds: 10
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
          resources:
            {{- toYaml .Values.pgbouncer.resources | nindent 12 }}
          securityContext:
            {{- include "rh.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/pgbouncer, readOnly: true }
            - { name: auth, mountPath: /etc/pgbouncer-auth, readOnly: true }
      volumes:
        - name: config
          configMap: { name: {{ $name }} }
        - name: auth
          secret:
            secretName: {{ include "rh.dbSecret" . }}
            items: [{ key: userlist.txt, path: userlist.txt }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "rh.labels" $ctx | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "rh.selector" $ctx | nindent 6 }}
{{- end }}
