{{- if not .Values.database.existingSecret }}
{{- $name := include "rh.dbSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := .Values.database.password }}
{{- if and (not $password) $existing }}{{ $password = index $existing.data "password" | b64dec }}{{ end }}
{{- if not $password }}{{ $password = randAlphaNum 32 }}{{ end }}
# Hook resource: the migration job runs before the normal resources exist, but needs the password.
# before-hook-creation re-creates it on upgrade with the same value (lookup), so it stays stable.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "rh.labels" (dict "root" . "name" "database") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-30"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  password: {{ $password | quote }}
  # PgBouncer auth file (scram-sha-256 needs the clear text password to log in to Postgres)
  userlist.txt: {{ printf "%q %q\n" .Values.database.user $password | quote }}
{{- end }}
