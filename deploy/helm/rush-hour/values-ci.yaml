# kind in GitHub Actions: images are loaded into the nodes (no pulls from GHCR), services are
# reachable on the NodePorts that deploy/kind/cluster.yaml maps to localhost:8001-8005.
image:
  repository: ghcr.io/omaraldulimay/rush-hour
  pullPolicy: IfNotPresent # --set image.tag=sha-<short> is passed by the workflow

services:
  catalog:
    nodePort: 30001
  inventory:
    nodePort: 30002
  checkout:
    nodePort: 30003
  payment-mock:
    nodePort: 30004
    env:
      PAYMENT_DECLINE_RATE: "0" # a declined payment is not a failed request, but keeps the numbers clean
  order-worker:
    nodePort: 30005
  control-room:
    env:
      PROMETHEUS_URL: http://prom-prometheus.monitoring.svc:9090

postgres:
  storage: 512Mi

# Monitoring: needs the CRDs of deploy/observability/values-ci.yaml (kube-prometheus-stack, installed first).
observability:
  interval: 5s
  serviceMonitors:
    enabled: true
  prometheusRule:
    enabled: true
    # Short `for:` so the fault-injection proof fits in minutes. The real 2 m is covered by the
    # promtool unit tests in observability/prometheus/tests.
    forOverrides:
      PaymentBreakerOpen: 20s
  dashboards:
    enabled: true

