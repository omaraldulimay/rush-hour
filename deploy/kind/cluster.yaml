# 1 control plane + 2 workers: enough for topology spread, PDBs and "kill one pod" tests.
# NodePorts 30001-30005 are published on localhost:8001-8005 (same ports as docker compose).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30001, hostPort: 8001, listenAddress: "127.0.0.1" }
      - { containerPort: 30002, hostPort: 8002, listenAddress: "127.0.0.1" }
      - { containerPort: 30003, hostPort: 8003, listenAddress: "127.0.0.1" }
      - { containerPort: 30004, hostPort: 8004, listenAddress: "127.0.0.1" }
      - { containerPort: 30005, hostPort: 8005, listenAddress: "127.0.0.1" }
  - role: worker
  - role: worker
