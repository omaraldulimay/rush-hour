[project]
name = "rush-hour"
version = "0.1.0"
description = "Nordkai Fashion shop platform used to prove Black Friday readiness"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Long PromQL expressions and panel descriptions are easier to read on one line.
"observability/grafana/build_dashboards.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["libs", "services", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning"]
