# Local stack: postgres, redis, a one-shot migrate+seed job and the five services.
# Credentials below are throwaway local-dev values; override with POSTGRES_PASSWORD.

x-env: &env
  DATABASE_URL: postgresql://rushhour:${POSTGRES_PASSWORD:-rushhour}@postgres:5432/rushhour
  REDIS_URL: redis://redis:6379/0
  CATALOG_URL: http://catalog:8000
  CHECKOUT_URL: http://checkout:8000
  INVENTORY_URL: http://inventory:8000
  PAYMENT_URL: http://payment-mock:8000

x-service: &service
  restart: unless-stopped
  environment: *env
  healthcheck:
    # python:3.12-slim has no curl
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 5s

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rushhour
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rushhour}
      POSTGRES_DB: rushhour
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rushhour -d rushhour"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Applies all migrations, then seeds. Safe to run repeatedly.
  migrate:
    build:
      context: .
      args:
        SERVICE: catalog
    image: rush-hour/catalog:dev
    command: ["sh", "-c", "python -m libs.common.migrate && python -m scripts.seed"]
    environment: *env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  catalog:
    <<: *service
    build:
      context: .
      args:
        SERVICE: catalog
    image: rush-hour/catalog:dev
    ports:
      - "8001:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  inventory:
    <<: *service
    build:
      context: .
      args:
        SERVICE: inventory
    image: rush-hour/inventory:dev
    ports:
      - "8002:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  payment-mock:
    <<: *service
    build:
      context: .
      args:
        SERVICE: payment_mock
    image: rush-hour/payment-mock:dev
    ports:
      - "8004:8000"
    environment:
      <<: *env
      PAYMENT_LATENCY_MS: "0"
      PAYMENT_ERROR_RATE: "0"
      PAYMENT_DECLINE_RATE: "${PAYMENT_DECLINE_RATE:-0.02}"

  checkout:
    <<: *service
    build:
      context: .
      args:
        SERVICE: checkout
    image: rush-hour/checkout:dev
    ports:
      - "8003:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      catalog:
        condition: service_healthy
      inventory:
        condition: service_healthy
      payment-mock:
        condition: service_healthy

  order-worker:
    <<: *service
    build:
      context: .
      args:
        SERVICE: order_worker
    image: rush-hour/order-worker:dev
    ports:
      - "8005:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      inventory:
        condition: service_healthy
      payment-mock:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2h
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro   # SLO recording rules + alerts
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  # Routes alerts by severity (page / ticket / timeline). No receivers with credentials: see the UI.
  alertmanager:
    image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  # Dashboards as code (observability/grafana). Anonymous visitors are Viewers; admin / admin edits.
  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_DASHBOARDS_DIR: /var/lib/grafana/dashboards
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/shop-overview.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # Mission control UI + demo admin API (starts the load, injects payment faults). Localhost only.
  control-room:
    <<: *service
    build:
      context: .
      args:
        SERVICE: control_room
    image: rush-hour/control-room:dev
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      <<: *env
      PROMETHEUS_URL: http://prometheus:9090
    depends_on:
      migrate:
        condition: service_completed_successfully
      checkout:
        condition: service_healthy

volumes:
  pgdata:
  grafana-data:
